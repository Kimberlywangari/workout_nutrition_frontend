name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kimberlywangari/workout-nutrition-frontend:latest
            ghcr.io/kimberlywangari/workout-nutrition-frontend:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker stack over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST || '206.189.235.97' }}
          port: 22
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            deploy_path="${{ secrets.DEPLOY_PATH }}"
            test -d "$deploy_path" || { echo 'DEPLOY_PATH does not exist'; exit 1; }
            cd "$deploy_path"
            test -f docker-compose.yml || { echo 'Missing docker-compose.yml; run API deployment first'; exit 1; }
            test -f .env || { echo 'Missing production .env in DEPLOY_PATH'; exit 1; }
            docker compose config --quiet
            exec 9>/tmp/workout-deploy.lock
            flock -w 300 9
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull frontend
            docker compose up -d --no-deps frontend
            docker image prune -f
